name: tests-tickets

on:
  pull_request:
    paths:
      - "tickets/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install libssl1.1 for mongodb-memory-server
        run: sudo apt-get update && sudo apt-get install -y libssl1.1
      - run: cd tickets && npm install && npm run test:ci
