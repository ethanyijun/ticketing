version: "3.8"

# Contract testing mock servers
# Uses Specmatic to create mock servers from OpenAPI contracts
# Alternative: Use WireMock, MSW, or Pact

services:
  orders-mock:
    image: specmatic/specmatic:latest
    container_name: orders-mock
    ports:
      - "3001:3000"
    volumes:
      - ./contracts/orders-service.yml:/app/contract.yml:ro
    command: stub /app/contract.yml --port 3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 5

