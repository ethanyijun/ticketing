apiVersion: skaffold/v4beta9
kind: Config
build:
  artifacts:
    - image: ethangai/auth
      context: .
      sync:
        manual:
          - src: src/**/*.ts
            dest: .
      docker:
        dockerfile: auth/Dockerfile
    - image: ethangai/client
      context: .
      sync:
        manual:
          - src: '**/*.{tsx,js}'
            dest: .
      docker:
        dockerfile: client/Dockerfile
    - image: ethangai/tickets
      context: .
      sync:
        manual:
          - src: src/**/*.ts
            dest: .
      docker:
        dockerfile: tickets/Dockerfile
    - image: ethangai/orders
      context: .
      sync:
        manual:
          - src: src/**/*.ts
            dest: .
      docker:
        dockerfile: orders/Dockerfile
    - image: ethangai/expiration
      context: .
      sync:
        manual:
          - src: src/**/*.ts
            dest: .
      docker:
        dockerfile: expiration/Dockerfile
    - image: ethangai/payments
      context: .
      sync:
        manual:
          - src: src/**/*.ts
            dest: .
      docker:
        dockerfile: payments/Dockerfile
    # - image: ethangai/email
    #   context: email-service
    #   sync:
    #     manual:
    #       - src: src/**/*.ts
    #         dest: .
    #   docker:
    #     dockerfile: Dockerfile
  local:
    push: false
manifests:
  rawYaml:
    - ./infra/k8s/*.yaml
    - ./infra/k8s-dev/*.yaml
deploy:
  kubectl: {}
